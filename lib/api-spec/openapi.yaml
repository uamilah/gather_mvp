openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for the Gather group events calendar
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Calendar event management
  - name: preferences
    description: Personal calendar choices
  - name: slack
    description: Slack channel sync
  - name: summary
    description: Upcoming event summary
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List calendar events
      responses:
        "200":
          description: Events in chronological order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a board calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid event identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid event update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      responses:
        "200":
          description: Deletion status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDeleteResult"
        "400":
          description: Invalid event identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /calendar-preferences/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listCalendarPreferences
      tags: [preferences]
      summary: List a member's calendar choices
      responses:
        "200":
          description: Saved calendar choices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarPreferenceListResponse"
        "400":
          description: Invalid member identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /calendar-preferences/{memberId}/{eventId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: string
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setCalendarPreference
      tags: [preferences]
      summary: Add or remove an event from a member's calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarPreferenceInput"
      responses:
        "200":
          description: Saved calendar choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarPreference"
        "400":
          description: Invalid preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /slack/channels:
    get:
      operationId: listSlackChannels
      tags: [slack]
      summary: List Slack conversations visible to the connected account
      responses:
        "200":
          description: Slack conversations available for monitoring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlackChannelListResponse"
  /slack/settings:
    get:
      operationId: getSlackSettings
      tags: [slack]
      summary: Get the monitored Slack conversation
      responses:
        "200":
          description: Slack sync settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlackSettings"
    put:
      operationId: saveSlackSettings
      tags: [slack]
      summary: Select a Slack conversation to monitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlackSettingsInput"
      responses:
        "200":
          description: Saved Slack sync settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlackSettings"
  /slack/sync:
    post:
      operationId: syncSlackConversation
      tags: [slack]
      summary: Sync the selected Slack conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlackSyncInput"
      responses:
        "200":
          description: Sync results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlackSyncResponse"
        "400":
          description: Invalid Slack conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /summary:
    get:
      operationId: getUpcomingSummary
      tags: [summary]
      summary: Summarize events in the next seven days
      responses:
        "200":
          description: Upcoming event summary and AI availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingSummary"
components:
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
    EventType:
      type: string
      enum: [meeting, social, service, deadline, fundraiser, other]
    EventSource:
      type: string
      enum: [board, slack]
    Event:
      type: object
      additionalProperties: false
      required: [id, title, date, startTime, location, type, mandatory, source, sourceChannelId, sourceChannelName, sourceMessageTs, sourcePermalink, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        startTime: { type: ["string", "null"] }
        location: { type: string }
        description: { type: ["string", "null"] }
        type: { $ref: "#/components/schemas/EventType" }
        mandatory: { type: boolean }
        source: { $ref: "#/components/schemas/EventSource" }
        sourceChannelId: { type: ["string", "null"] }
        sourceChannelName: { type: ["string", "null"] }
        sourceMessageTs: { type: ["string", "null"] }
        sourcePermalink: { type: ["string", "null"], format: uri }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EventListResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
    EventInput:
      type: object
      additionalProperties: false
      required: [title, date, startTime, location, type, mandatory]
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        startTime: { type: ["string", "null"] }
        location: { type: string, maxLength: 240 }
        description: { type: ["string", "null"], maxLength: 2000 }
        type: { $ref: "#/components/schemas/EventType" }
        mandatory: { type: boolean }
    EventUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        startTime: { type: ["string", "null"] }
        location: { type: string, maxLength: 240 }
        description: { type: ["string", "null"], maxLength: 2000 }
        type: { $ref: "#/components/schemas/EventType" }
        mandatory: { type: boolean }
    EventDeleteResult:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted: { type: boolean }
    CalendarPreference:
      type: object
      additionalProperties: false
      required: [memberId, eventId, included, updatedAt]
      properties:
        memberId: { type: string }
        eventId: { type: string, format: uuid }
        included: { type: boolean }
        updatedAt: { type: string, format: date-time }
    CalendarPreferenceInput:
      type: object
      additionalProperties: false
      required: [included]
      properties:
        included: { type: boolean }
    CalendarPreferenceListResponse:
      type: object
      additionalProperties: false
      required: [preferences]
      properties:
        preferences:
          type: array
          items: { $ref: "#/components/schemas/CalendarPreference" }
    SlackChannel:
      type: object
      additionalProperties: false
      required: [id, name, type, isPrivate]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [public_channel, private_channel, group_dm, direct_message] }
        isPrivate: { type: boolean }
    SlackChannelListResponse:
      type: object
      additionalProperties: false
      required: [connected, channels, error]
      properties:
        connected: { type: boolean }
        channels:
          type: array
          items: { $ref: "#/components/schemas/SlackChannel" }
        error: { type: ["string", "null"] }
    SlackSettings:
      type: object
      additionalProperties: false
      required: [selectedChannel, lastSyncAt, pollSeconds, error]
      properties:
        selectedChannel: { oneOf: [{ $ref: "#/components/schemas/SlackChannel" }, { type: "null" }] }
        lastSyncAt: { type: ["string", "null"], format: date-time }
        pollSeconds: { type: integer }
        error: { type: ["string", "null"] }
    SlackSettingsInput:
      type: object
      additionalProperties: false
      required: [channelId]
      properties:
        channelId: { type: ["string", "null"] }
    SlackSyncInput:
      type: object
      additionalProperties: false
      required: [channelId]
      properties:
        channelId: { type: string, minLength: 1 }
    SlackSyncResponse:
      type: object
      additionalProperties: false
      required: [imported, updated, ignored, checkedAt, message]
      properties:
        imported: { type: integer }
        updated: { type: integer }
        ignored: { type: integer }
        checkedAt: { type: string, format: date-time }
        message: { type: string }
    UpcomingSummary:
      type: object
      additionalProperties: false
      required: [summary, aiEnabled, eventCount, mandatoryCount, generatedAt]
      properties:
        summary: { type: string }
        aiEnabled: { type: boolean }
        eventCount: { type: integer }
        mandatoryCount: { type: integer }
        generatedAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }

